<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Трансфигурация</title>
  <link rel="stylesheet" href="Transfiguration.css">
</head>
<body>

  <!-- ЭКРАН "ПОВЕРНИ ТЕЛЕФОН" -->
  <div id="rotateScreen">
    <span id="rotateText">Поверни телефон и нажми дважды на экран...</span>
  </div>

  <!-- ШАПКА -->
  <header class="site-header" id="header">
    <div class="header-inner">
      <a href="https://nracademy.github.io/Villains_Descendants/%D0%A1%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0%20%D0%BE%D0%B1%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D1%8F/%D0%BC%D0%B5%D0%BD%D1%8E/lessons.html" class="header-link">НАЗАД</a>
      <span class="header-link" id="btnInstruction">ИНСТРУКЦИЯ</span>
      <span class="header-link" id="btnGuide">СПРАВОЧНИК</span>
      <a href="https://vk.com/veneno_bianco" target="_blank" class="header-link">ПОМОЩЬ</a>
    </div>
  </header>

  <!-- ФОНОВОЕ ВИДЕО -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="фон.mp4" type="video/mp4">
  </video>

  <!-- БОКОВЫЕ ЗАТЕМНИТЕЛИ (fixed, от верха до низа экрана) -->
  <div class="side-panel left-panel">
    <img src="затемнение 1.png" alt="" class="dim-img">
    <img src="кнопка 1.png" alt="" class="side-btn">
  </div>
  <div class="side-panel right-panel">
    <img src="затемнение 2.png" alt="" class="dim-img">
    <img src="кнопка 2.png" alt="" class="side-btn">
  </div>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="page-wrapper">

    <!-- НАЗВАНИЕ -->
    <div class="title-block">
      <img src="название.png" alt="Трансфигурация" class="title-img">
    </div>

    <!-- УРОКИ -->
    <div class="center-zone">
      <div class="lessons-grid">
        <a href="first_lesson/first_lesson.html"><img src="урок 1.png" alt="Урок 1" class="lesson-btn lesson-1"></a>
        <img src="урок 3.png" alt="Урок 3" class="lesson-btn lesson-3">
        <img src="урок 2.png" alt="Урок 2" class="lesson-btn lesson-2">
      </div>
    </div>

  </div>

  <!-- ЛЕПЕСТКИ -->
  <div id="stones-container"></div>

  <!-- МОДАЛЬНОЕ ОКНО ИНСТРУКЦИЯ -->
  <div class="modal-overlay" id="modalInstruction">
    <div class="modal-box">
      <button class="modal-close" id="closeInstruction">✕</button>
      <button class="modal-nav modal-prev" id="instrPrev">
        <img src="инструкция/кнопка 1.png" alt="Назад">
      </button>
      <img src="инструкция/инструкция 1.png" alt="" class="modal-img" id="instrImg">
      <button class="modal-nav modal-next" id="instrNext">
        <img src="инструкция/кнопка 2.png" alt="Вперед">
      </button>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО СПРАВОЧНИК -->
  <div class="modal-overlay" id="modalGuide">
    <div class="modal-box">
      <button class="modal-close" id="closeGuide">✕</button>
      <button class="modal-nav modal-prev" id="guidePrev">
        <img src="инструкция/кнопка 1.png" alt="Назад">
      </button>
      <img src="инструкция/инструкция 1.png" alt="" class="modal-img" id="guideImg">
      <button class="modal-nav modal-next" id="guideNext">
        <img src="инструкция/кнопка 2.png" alt="Вперед">
      </button>
    </div>
  </div>

  <script src="Transfiguration.js"></script>
</body>
</html>
